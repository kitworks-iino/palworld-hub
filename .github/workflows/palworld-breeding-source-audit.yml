name: Palworld fixed-build breeding verification

on:
  workflow_call:
  push:
    branches: ['release/palworld-20261019']
    paths:
      - "**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/palworld-breeding-source-audit.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: palworld-fixed-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-build:
    name: Detect a newer public server build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare Steam public Build ID with the pinned build
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          baseline = json.loads(Path("data/verification.json").read_text())
          compatible = Path("data/current-compatibility.json")
          current_evidence = json.loads(compatible.read_text()) if compatible.exists() else {}
          expected = str(current_evidence.get("compatibleServerBuildId", baseline["targetServerBuildId"]))
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          try:
              request = urllib.request.Request(
                  "https://api.steamcmd.net/v1/info/2394010",
                  headers={"User-Agent": "palworld-hub-build-monitor/2"},
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = json.load(response)
              actual = str(payload["data"]["2394010"]["depots"]["branches"]["public"]["buildid"])
          except Exception as error:
              message = f"Steam Build ID lookup failed without changing the fixed dataset: {error}"
              print(f"::warning::{message}")
              with open(summary, "a", encoding="utf-8") as output:
                  output.write(f"### Palworld build monitor\n\n{message}\n")
          else:
              if actual != expected:
                  message = (
                      f"New public server build detected: {actual}; latest evidenced build: {expected}. "
                      "The site will display the version mismatch until the new game files are verified."
                  )
                  print(f"::warning::{message}")
              else:
                  message = f"Public server build matches the latest evidenced build {expected}."
                  print(message)
              with open(summary, "a", encoding="utf-8") as output:
                  output.write(f"### Palworld build monitor\n\n{message}\n")
          PY

  verify:
    name: Rebuild, exhaustively test, and compare
    needs: current-build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Reject private game inputs and compiled artifacts
        run: python tools/check_repository_hygiene.py
      - name: Compile deterministic generators
        run: python -m py_compile tools/audit_breeding_sources.py tools/validate_exact_build_evidence.py tools/build_verified_dataset.py tools/check_repository_hygiene.py tools/test_pal_icon_extractor_isolation.py tools/verify_native_breeding_binary.py tools/verify_native_breeding_runtime.py tools/build_site.py tools/compare_current_game_evidence.py
      - name: Restore and compile the pinned icon extractor
        run: |
          dotnet restore tools/pal-icon-extractor/PalIconExtractor.csproj --locked-mode
          dotnet build tools/pal-icon-extractor/PalIconExtractor.csproj --configuration Release --no-restore
      - name: Verify the icon extractor rejects ambiguous container roots
        run: python tools/test_pal_icon_extractor_isolation.py
      - name: Rebuild from fixed-build asset evidence
        run: python tools/build_verified_dataset.py
      - name: Enforce comparison-only auxiliary source policy
        run: python tools/audit_breeding_sources.py
      - name: Reject generated drift
        run: git diff --exit-code -- data audit
      - name: Run exhaustive data, icon, reverse-index, parent-list, and tree tests
        run: python -m unittest -v tests.test_verified_dataset tests.test_pal_icons tests.test_current_game_evidence
      - name: Install browser test dependency
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Chromium desktop and iPhone-viewport browser tests
        run: npm run test:palworld
      - name: Retain the desktop and mobile release previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palworld-release-previews-${{ github.sha }}
          path: test-results/**/release-*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload diagnostics only after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: palworld-verification-failure-${{ github.sha }}
          path: |
            audit/exact-build-evidence.json
            audit/exact-comparison.json
            audit/native-runtime-comparison.json
            data/verification.json
            test-results/
          if-no-files-found: ignore
          retention-days: 3
