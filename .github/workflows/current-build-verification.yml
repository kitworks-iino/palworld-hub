name: Palworld current game data verification

on:
  workflow_dispatch:
  push:
    branches: ['release/palworld-20261019']
    paths:
      - '.github/workflows/current-build-verification.yml'
      - 'tools/extract_current_game_evidence.py'

permissions:
  contents: read

concurrency:
  group: palworld-current-game-evidence
  cancel-in-progress: false

jobs:
  extract-current-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the extraction inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the extractor runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SteamCMD and static analysis prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils lib32gcc-s1 lib32stdc++6

      - name: Extract evidence from the anonymous public Linux depot
        shell: bash
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          set -euo pipefail
          python3 tools/extract_current_game_evidence.py \
            --expected-build 25247047 \
            --work-dir "$RUNNER_TEMP/palworld-current-work" \
            --output-dir "$RUNNER_TEMP/palworld-current-evidence"

      - name: Compare current game data with the verified baseline
        if: ${{ success() && hashFiles('tools/compare_current_game_evidence.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/compare_current_game_evidence.py \
            "$RUNNER_TEMP/palworld-current-evidence/build-25247047.assets.json" \
            --output "$RUNNER_TEMP/palworld-current-evidence/current-input-comparison.json"

      - name: Upload derived JSON evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: current-game-evidence-25247047-${{ github.sha }}
          path: |
            ${{ runner.temp }}/palworld-current-evidence/build-25247047.assets.json
            ${{ runner.temp }}/palworld-current-evidence/build-25247047.provenance.json
            ${{ runner.temp }}/palworld-current-evidence/build-25247047.native-static.json
            ${{ runner.temp }}/palworld-current-evidence/current-input-comparison.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Remove downloaded game and temporary extractor files
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/palworld-current-work"
